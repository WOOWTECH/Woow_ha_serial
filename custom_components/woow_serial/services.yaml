send:
  name: Send (serial)
  description: 'Send bytes or text on a port, optionally waiting for the reply frame (returned when a response is
    requested). Add return_response: true to get the result.'
  fields:
    config_entry_id:
      name: Port (entry)
      description: The port's config entry. Give this or `port`.
      selector:
        config_entry:
          integration: woow_serial
    port:
      name: Port
      description: Port name (e.g. RS485-1), device path (/dev/ttySC0) or config entry id, as list_ports returns
        them.
      example: RS485-1
      selector:
        text: null
    hex:
      name: HEX
      description: Bytes as HEX, e.g. A5 5A 01 02.
      example: A5 5A 01 02
      selector:
        text: null
    text:
      name: Text
      description: Text with \r \n \xHH escapes; the port's line ending is appended.
      example: PWR ON\r
      selector:
        text: null
    expect:
      name: Expected reply
      description: Wait for the first frame matching this receive pattern (HEX with ?? and *, or a regular expression
        for text) and skip the others, e.g. polls of other devices on the line. Waits wait_ms, 2000 ms if not given;
        the reply's captures are returned.
      example: 04 04 *
      selector:
        text: null
    wait_ms:
      name: Wait for reply
      description: 0 = do not wait. Otherwise return the next received frame (or timeout).
      default: 0
      selector:
        number:
          min: 0
          max: 60000
          step: 10
          unit_of_measurement: ms
          mode: box
    note:
      name: Note
      description: Why this is done, in a sentence. Shown to people in the panel's activity log.
      example: Checking that the projector answers
      selector:
        text: null
describe:
  name: Describe
  description: 'Returns how to use this integration: workflow, device types and actions, the device definition fields,
    command template and receive pattern syntax, checksums, events, current ports, templates and devices. Call this
    first. Call it with return_response: true.'
list_ports:
  name: List ports
  description: 'Returns every port (on-board UARTs and bound external devices) with its id, name, kind, line settings,
    availability and counters. Call it with return_response: true.'
get_monitor:
  name: Get monitor
  description: 'Returns the frames the ports have heard, grouped by sender (header / address bytes), with counts,
    readable text and the checksum each group agrees on. Call it with return_response: true.'
  fields:
    port:
      name: Port
      description: Port name (e.g. RS485-1), device path (/dev/ttySC0) or config entry id, as list_ports returns
        them.
      example: RS485-1
      selector:
        text: null
    limit:
      name: Groups
      description: How many groups to return, most recently heard first.
      default: 20
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    include_hidden:
      name: Include hidden
      description: Also return groups hidden in the panel.
      default: false
      selector:
        boolean: null
get_send_log:
  name: Get send log
  description: 'Returns what Home Assistant sent: content, origin (service, entity, panel, device), count, whether
    the equipment answered (reply and delay) and which other ports heard it. Call it with return_response: true.'
  fields:
    port:
      name: Port
      description: Port name (e.g. RS485-1), device path (/dev/ttySC0) or config entry id, as list_ports returns
        them.
      example: RS232
      selector:
        text: null
    limit:
      name: Limit
      description: How many entries to return, newest first.
      default: 20
      selector:
        number:
          min: 1
          max: 1000
          mode: box
listen:
  name: Listen
  description: 'Waits for the next frame a port hears (not one Home Assistant sent) and returns it: ask the person
    to press the remote or keypad button first. Call it with return_response: true.'
  fields:
    port:
      name: Port
      description: Port name (e.g. RS485-1), device path (/dev/ttySC0) or config entry id, as list_ports returns
        them.
      required: true
      example: RS485-1
      selector:
        text: null
    timeout:
      name: Timeout
      description: Seconds to wait for the frame.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s
          mode: box
list_devices:
  name: List devices
  description: 'Returns the managed devices with their full definition, current state and entity ids. Call it with
    return_response: true.'
  fields:
    port:
      name: Port
      description: Port name (e.g. RS485-1), device path (/dev/ttySC0) or config entry id, as list_ports returns
        them.
      example: RS485-1
      selector:
        text: null
    type:
      name: Type
      description: Only devices / templates of this type.
      selector:
        select:
          options:
          - switch
          - light
          - cover
          - media_player
          - select
          - keypad
          - other
get_device:
  name: Get device
  description: 'Returns one managed device: definition, state, entity ids and the actions other buttons may bind
    to it. Call it with return_response: true.'
  fields:
    device:
      name: Device
      description: Device name or id, as list_devices returns them.
      required: true
      example: Living room curtain
      selector:
        text: null
preview_command:
  name: Preview command
  description: 'Returns the bytes a command template sends with these parameters and value, or a coded error explaining
    why it cannot. Call it with return_response: true.'
  fields:
    payload:
      name: Template
      description: 'Command template as in a device definition, HEX or text: the example shows the syntax, describe
        explains it.'
      required: true
      example: 55 {addr} 03 04 {value:u8} {crc16_modbus}
      selector:
        text: null
    format:
      name: Format
      description: hex (bytes) or text (ASCII with escapes / regular expression).
      default: hex
      selector:
        select:
          options:
          - hex
          - text
    params:
      name: Parameters
      description: 'Device parameters: an object of name and value (HEX for HEX templates, text for text ones),
        as in the example.'
      example: '{"addr": "01 02"}'
      selector:
        object: null
    value:
      name: Value
      description: The value a template's value field takes, in device units.
      example: 50
      selector:
        number:
          min: -2147483648
          max: 4294967295
          mode: box
test_pattern:
  name: Test pattern
  description: 'Tries a receive pattern on the frames the monitor holds for a port; returns the frames that match
    and what each capture reads. Call it with return_response: true.'
  fields:
    pattern:
      name: Pattern
      description: 'Receive pattern as in a device definition (HEX, or a regular expression for text): the example
        shows the syntax.'
      required: true
      example: 55 {addr} 01 02 {pos:u8} {crc16_modbus}
      selector:
        text: null
    port:
      name: Port
      description: Port name (e.g. RS485-1), device path (/dev/ttySC0) or config entry id, as list_ports returns
        them.
      required: true
      example: RS485-1
      selector:
        text: null
    format:
      name: Format
      description: hex (bytes) or text (ASCII with escapes / regular expression).
      default: hex
      selector:
        select:
          options:
          - hex
          - text
    params:
      name: Parameters
      description: 'Device parameters: an object of name and value (HEX for HEX templates, text for text ones),
        as in the example.'
      example: '{"addr": "01 02"}'
      selector:
        object: null
list_templates:
  name: List templates
  description: 'Returns the built-in and local device templates: id, brand, model, type, required line settings,
    parameters, commands and buttons. Call it with return_response: true.'
  fields:
    type:
      name: Type
      description: Only devices / templates of this type.
      selector:
        select:
          options:
          - switch
          - light
          - cover
          - media_player
          - select
          - keypad
          - other
get_activity:
  name: Get activity
  description: 'Returns the activity log: what was changed or sent, by whom (service, panel, entity), when, with
    the note given. Call it with return_response: true.'
  fields:
    limit:
      name: Limit
      description: How many entries to return, newest first.
      default: 50
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    device:
      name: Device
      description: Device name or id, as list_devices returns them.
      example: Living room curtain
      selector:
        text: null
save_device:
  name: Save device
  description: 'Creates or replaces a managed device from a full definition (see describe). Names may stand for
    ids: the port, command names in actions / options / poll_command, a button''s target device. Returns the saved
    device, or a coded error to fix and resend. Needs an admin user. Add return_response: true to get the result.'
  fields:
    device:
      name: Device
      description: 'The device definition object: name, type, port (or port_id), params, commands, actions, options,
        rules, sensors, buttons, ranges, poll_command, poll_interval.'
      required: true
      example: '{"name": "Living room curtain", "type": "cover", "port": "RS485-1", "params": {"addr": "01 02"},
        "commands": [{"name": "Open", "payload": "55 {addr} 03 01 {crc16_modbus}"}], "actions": {"open": "Open"}}'
      selector:
        object: null
    replace:
      name: Replace same name
      description: Saving a device whose name already exists updates that device instead of failing.
      default: true
      selector:
        boolean: null
    note:
      name: Note
      description: Why this is done, in a sentence. Shown to people in the panel's activity log.
      example: Curtain motor found on RS485-1 at address 01 02
      selector:
        text: null
create_from_template:
  name: Create from template
  description: 'Creates a managed device from a built-in or local template on a port, filling in its parameters
    (usually the device address). Returns the device and the line settings the equipment expects. Needs an admin
    user. Add return_response: true to get the result.'
  fields:
    template:
      name: Template
      description: Template id, from list_templates.
      required: true
      example: dooya_rs485_curtain
      selector:
        text: null
    port:
      name: Port
      description: Port name (e.g. RS485-1), device path (/dev/ttySC0) or config entry id, as list_ports returns
        them.
      required: true
      example: RS485-1
      selector:
        text: null
    name:
      name: Name
      description: Device name; the template's name when empty.
      example: Living room curtain
      selector:
        text: null
    params:
      name: Parameters
      description: 'The template''s parameters, usually the device address: an object of name and value as in the
        example. list_templates shows each template''s parameters.'
      example: '{"addr": "01 02"}'
      selector:
        object: null
    note:
      name: Note
      description: Why this is done, in a sentence. Shown to people in the panel's activity log.
      example: Installer said the curtain is a Dooya DT52E, ID 01 02
      selector:
        text: null
delete_device:
  name: Delete device
  description: 'Deletes a managed device and its entities. Needs an admin user. Add return_response: true to get
    the result.'
  fields:
    device:
      name: Device
      description: Device name or id, as list_devices returns them.
      required: true
      example: Living room curtain
      selector:
        text: null
    note:
      name: Note
      description: Why this is done, in a sentence. Shown to people in the panel's activity log.
      selector:
        text: null
run_command:
  name: Run command
  description: 'Sends one command of a managed device (all its repeats); returns what was sent and the reply when
    the command waits for one. Add return_response: true to get the result.'
  fields:
    device:
      name: Device
      description: Device name or id, as list_devices returns them.
      required: true
      example: Projector
      selector:
        text: null
    command:
      name: Command
      description: Command name or id.
      required: true
      example: Power on
      selector:
        text: null
    value:
      name: Value
      description: The value for commands that take one, in device units.
      example: 30
      selector:
        number:
          min: -2147483648
          max: 4294967295
          mode: box
    note:
      name: Note
      description: Why this is done, in a sentence. Shown to people in the panel's activity log.
      selector:
        text: null
learn_command:
  name: Learn command
  description: 'Listens on the device''s port and adds the next frame heard as a new command of the device (ask
    the person to press the original remote first). Returns the device and what was heard. Needs an admin user.
    Add return_response: true to get the result.'
  fields:
    device:
      name: Device
      description: Device name or id, as list_devices returns them.
      required: true
      example: Projector
      selector:
        text: null
    name:
      name: Command name
      description: Name of the new command.
      required: true
      example: Power on
      selector:
        text: null
    timeout:
      name: Timeout
      description: Seconds to wait for the frame.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s
          mode: box
    note:
      name: Note
      description: Why this is done, in a sentence. Shown to people in the panel's activity log.
      selector:
        text: null
learn_button:
  name: Learn button
  description: 'Listens on a keypad''s port and adds the next frame heard as a new button (ask the person to press
    the physical button first). Returns the keypad and what was heard. Needs an admin user. Add return_response:
    true to get the result.'
  fields:
    device:
      name: Keypad
      description: Keypad device name or id.
      required: true
      example: Hallway keypad
      selector:
        text: null
    name:
      name: Button name
      description: Name of the new button.
      required: true
      example: Scene 1
      selector:
        text: null
    timeout:
      name: Timeout
      description: Seconds to wait for the frame.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s
          mode: box
    note:
      name: Note
      description: Why this is done, in a sentence. Shown to people in the panel's activity log.
      selector:
        text: null
